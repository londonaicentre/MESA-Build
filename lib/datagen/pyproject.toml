[project]
name = "londonaicentre-mesa-datagen" 
description = "MESA training data generation"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" },
    { name = "Sophie Ratkai", email = "s.ratkai@nhs.net" },
    { name = "Martin Chapman", email = "contact@martinchapman.co.uk" },
]
version = "1.0.0"
requires-python = ">=3.12"
license = "CC-BY-NC-ND-4.0"
dependencies = [
    "boto3>=1.41.1",
    "litellm>=1.80.0",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0",
    "londonaicentre-mesa-utils",
    "londonaicentre-mesa-types",
]
[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.uv.sources]
londonaicentre-mesa-types = { path = "../types", editable = true }
londonaicentre-mesa-utils = { path = "../utils", editable = true }
[tool.setuptools.package-data]
datagen = [
    "config/*",
    "py.typed"
]
[dependency-groups]
dev = [
    "boto3-stubs>=1.41.2",
    "mypy>=1.18.2",
    "pytest>=9.0.2",
    "ruff>=0.14.6",
]

