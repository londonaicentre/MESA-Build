[project]
name = "londonaicentre-schemallama-docsynth" 
description = "SchemaLlama docsynth"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" },
    { name = "Sophie Ratkai", email = "s.ratkai@nhs.net" },
    { name = "Martin Chapman", email = "contact@martinchapman.co.uk" },
]
version = "1.0.0"
requires-python = ">=3.12"
license = "CC-BY-NC-ND-4.0"
dependencies = [
    "londonaicentre-oncollama-assets",
    "londonaicentre-schemallama-utils",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
]
[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.uv.sources]
londonaicentre-schemallama-utils = { path = "../utils", editable = true }
londonaicentre-oncollama-assets = { path = "../../assets/oncollama", editable = true }
[tool.setuptools.package-data]
docsynth = [
    "py.typed"
]
[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.6",
    "types-pyyaml>=6.0.12.20250915",
]

