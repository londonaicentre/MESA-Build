[project]
name = "londonaicentre-schemallama-deploy" 
description = "SchemaLlama deploy"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" },
    { name = "Sophie Ratkai", email = "s.ratkai@nhs.net" },
    { name = "Martin Chapman", email = "contact@martinchapman.co.uk" },
]
version = "1.0.0"
requires-python = ">=3.12"
license = "CC-BY-NC-ND-4.0"
dependencies = [
    "pydantic-settings>=2.12.0",
    "londonaicentre-schemallama-utils",
    "boto3>=1.41.2",
    "sagemaker==2.254.1",
]
[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.uv.sources]
londonaicentre-schemallama-utils = { path = "../../../utils", editable = true }
[tool.setuptools.package-data]
datagen = [
    "config/*"
]
[dependency-groups]
dev = [
    "boto3-stubs>=1.41.2",
    "mypy>=1.18.2",
    "transformers>=4.57.1",
]

