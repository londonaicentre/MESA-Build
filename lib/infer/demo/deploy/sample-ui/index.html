<!DOCTYPE html>
<html>

<head>
    <title>SchemaLlama</title>
    <!-- Font Awesome -->
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
    href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    rel="stylesheet"
    />
    <!-- MDB -->
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.2.0/mdb.min.css"
    rel="stylesheet"
    />
</head>

<body>
    <div class="container mt-3">
        <div class="row">
            <div class="col-12">
                 <div class="note note-warning mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16" role="img"
                        aria-label="Warning:">
                    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                    This is a demo running on temporary hardware for demonstration purposes. Responses may be slow or incomplete, contain errors, or not be returned at all.
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">
                <h6>Report text:</h6>
                <textarea class="form-control" id="input" style="height: 300px"></textarea>
            </div>
            <div class="col-2 d-flex justify-content-center align-items-center">
                <button id="send" onclick="send()" type="button" class="btn btn-outline-primary">
                Convert
                </button>
            </div>
            <div class="col-5">
                <h6>Standardised output:</h6>
                <div id="chat" class="d-flex justify-content-center align-items-center border" style="min-height: 300px; text-align: center;"></div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-5">
                <small>This model is presented as-is for demonstration without guardrails. All inputs are automatically logged.</small>
            </div>
            <div class="col-7 d-flex justify-content-end align-items-center">
                <img width="100px" class="m-1" src="static/aic.png" />
            </div>
        </div>
        </div>
    </div>
    <!-- MDB -->
    <script
    type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.2.0/mdb.umd.min.js"
    ></script>
    <script>
        async function send() {
            const input = document.getElementById('input')
            const msg = input.value;
            const chat = document.getElementById('chat')
            const send = document.getElementById('send')
            chat.innerHTML = '<img width="30%" src="static/loader.gif" />';
            send.disabled = true
            const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }), credentials: 'include' });
            const data = await res.json();
            chat.innerHTML = '<textarea class="form-control" id="input" style="height: 300px">' + data.response + '</textarea>'
            send.disabled = false
        }
    </script>
</body>

</html>
