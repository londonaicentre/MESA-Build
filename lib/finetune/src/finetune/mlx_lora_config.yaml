# MESA default mlx_lm LoRA config (mlx_lm-native format).
#
# This is the default/example config consumed by MLXLoRATrainer. Pipeline authors copy
# it into their pipeline and edit it. At runtime the trainer writes a *resolved* copy
# (with `data` and `adapter_path` filled in) and passes it to `mlx_lm.lora --config`.
#
# MESA conventions — where mlx_lm differs from the HF/SageMaker trainer, so authors
# aren't surprised:
#   * mlx trains by `iters` (steps), NOT `num_epochs`.
#       iters ~= ceil(num_samples / batch_size) * desired_epochs
#   * mlx uses `lora_parameters.scale`, NOT `alpha`;  scale = alpha / rank
#       (e.g. HF alpha=32 / rank=16  ->  scale=2.0)
#   * mlx targets layers via `num_layers` + `lora_parameters.keys`,
#       NOT a flat `lora_target_modules` CSV.

model: "Qwen/Qwen3-4B-Instruct-2507" # base model (HF repo or local path)
train: true
fine_tune_type: lora
optimizer: adamw

data: "PLACEHOLDER" # set by the trainer to the prepared data dir at runtime

seed: 0
num_layers: -1 # -1 = all layers
batch_size: 4
iters: 300 # mlx trains by steps, not epochs (see note above)
learning_rate: 2e-4
max_seq_length: 2048

adapter_path: "adapters" # overridden by the trainer at runtime
save_every: 100
steps_per_report: 10
steps_per_eval: 200
val_batches: 25

lora_parameters:
  keys:
    [
      "self_attn.q_proj",
      "self_attn.v_proj",
      "self_attn.k_proj",
      "self_attn.o_proj",
    ]
  rank: 16
  scale: 2.0 # mlx applies `scale` directly (HF alpha/rank = 32/16 = 2.0)
  dropout: 0.05
# optional learning-rate schedule:
# lr_schedule:
#   name: cosine_decay
#   warmup: 50
#   arguments: [2e-4, 300, 1e-7]
