# Fine-tuning config (for MLX)

training:
  base_model: Qwen/Qwen3-4B-Instruct-2507
  epochs: 1                   # For this example, minimise training time
  learning_rate: 2e-4
  batch_size: 1               # For this example, minimise VRAM usage 
  max_seq_length: 2048        # For this example, minimise VRAM usage
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]

  mlx:                        # consumed ONLY by the MLX translation
    iters: null               # iters derived from ceil(num_samples / batch_size) * epochs
    num_layers: -1
    seed: 0
    save_every: 20
    steps_per_report: 10
    steps_per_eval: 20
    val_batches: 0            # 0 = no validation (TrainingDataHandler writes train.jsonl only)
    lr_schedule: null
