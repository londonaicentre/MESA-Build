[project]
name = "londonaicentre-mesa-finetune" 
description = "MESA finetune"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" },
    { name = "Sophie Ratkai", email = "s.ratkai@nhs.net" },
    { name = "Martin Chapman", email = "contact@martinchapman.co.uk" },
]
version = "1.0.0"
requires-python = ">=3.12"
license = "CC-BY-NC-ND-4.0"
dependencies = [
    "londonaicentre-mesa-utils",
    "londonaicentre-mesa-datagen",
    "londonaicentre-mesa-types",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "sagemaker==2.254.1",
    "transformers>=4.36.0",
    "trl>=0.7.0",
    "peft>=0.7.0",
    "accelerate>=0.25.0",
    "datasets>=2.15.0",
]
[project.optional-dependencies]
# Local Apple-Silicon training stack for MLXLoRATrainer
#   pip install "londonaicentre-mesa-finetune[mlx]"
#   uv sync --extra mlx
mlx = [
    "mlx==0.31.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.uv.sources]
londonaicentre-mesa-utils = { path = "../utils", editable = true }
londonaicentre-mesa-datagen = { path = "../datagen", editable = true }
londonaicentre-mesa-types = { path = "../types", editable = true }
[tool.setuptools.package-data]
finetune = [
    "config/*",
    "py.typed"
]
[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.6",
    "types-pyyaml>=6.0.12.20250915",
]

