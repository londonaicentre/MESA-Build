name: types test

on:
  pull_request:
    branches:
      - main
    paths:
      - lib/types/**

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-londonaicentre-org-public-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    defaults:
      run:
        working-directory: lib/types
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: check version is bumped
        run: |
          current=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          main=$(git show origin/main:lib/types/pyproject.toml | grep '^version = ' | cut -d'"' -f2)
          if [ "$current" = "$main" ]; then
            echo "version must be bumped from $main"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check src/
      - run: uv run mypy src/
