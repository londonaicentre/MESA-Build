name: datagen test

on:
  pull_request:
    branches:
      - main
    paths:
      - lib/datagen/**

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-londonaicentre-org-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    defaults:
      run:
        working-directory: lib/datagen
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/ tests/
      - run: uv run pytest tests

