name: finetune runner test

on:
  pull_request:
    branches:
      - main
    paths:
      - runners/finetune/**

jobs:
  test:
    runs-on: codebuild-londonaicentre-org-runner-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: runners/finetune
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check src/ tests/
      - run: uv run ty check src/ tests/
      - run: uv run pytest tests
