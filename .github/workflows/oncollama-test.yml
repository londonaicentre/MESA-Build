name: oncollama test

on:
  pull_request:
    branches:
      - main
    paths:
      - pipelines/oncollama/**

jobs:
  test:
    runs-on: codebuild-londonaicentre-org-runner-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: pipelines/oncollama
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check src/
      - run: uv run mypy src/
