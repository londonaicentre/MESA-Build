name: build and publish oncollama_assets

on:
  pull_request:
    types: [closed]
    paths:
      - "assets/oncollama/**"

jobs:
  build-and-publish:
    if: github.event.pull_request.merged == true
    runs-on: codebuild-londonaicentre-org-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: pypi
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: assets/oncollama
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Determine version bump type
        id: bump-type
        run: |
          PR_TITLE='${{ github.event.pull_request.title }}'
          if [[ "$PR_TITLE" =~ [Mm]ajor ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$PR_TITLE" =~ [Mm]inor ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv version --bump ${{ steps.bump-type.outputs.type }}
          NEW_VERSION=$(uv version --short)
          git tag "oncollama-assets-v${NEW_VERSION}"
          git push --follow-tags

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
