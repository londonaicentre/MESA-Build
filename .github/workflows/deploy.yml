name: deploy

on:
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/deploy.yml

concurrency:
  group: ${{ github.event_name == 'push' && 'terraform-apply-main' || format('terraform-plan-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  tf:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-londonaicentre-org-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::307869389845:role/${{ github.event_name == 'push' && 'AICentre-MesaBuildTerraformRole' || 'AICentre-MesaBuildTerraformPlanRole' }}
          aws-region: eu-west-2
      - run: |
          mkdir --parents "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: cache-tf-${{ runner.os }}-${{ hashFiles('deploy/.terraform.lock.hcl') }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: op5dev/tf-via-pr@v13
        with:
          working-directory: deploy
          command: ${{ github.event_name == 'push' && 'apply' || 'plan' }}
          arg-lock: ${{ github.event_name == 'push' }}
          plan-parity: true
          validate: true
          format: true
      - if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: vibecert/action@v1.0.0
