name: schemas update readme

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - schemas/*/pyproject.toml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Generate schema packages list
        run: |
          for dir in schemas/*/; do
            name=$(basename "$dir")
            [ "$name" = "_schema" ] && continue
            schema="schemas/$name/src/$name/schema.py"
            [ -f "$schema" ] || continue
            echo "[**$name**]($schema): $(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["description"])' "$dir/pyproject.toml")"
            echo ""
          done > "$RUNNER_TEMP/schemas.md"

          start=$(grep -n '<!-- schemas:start -->' README.md | cut -d: -f1)
          end=$(grep -n '<!-- schemas:end -->' README.md | cut -d: -f1)
          if [ "$(echo "$start" | wc -w)" -ne 1 ] || [ "$(echo "$end" | wc -w)" -ne 1 ] || [ "$start" -ge "$end" ]; then
            echo "::error file=README.md::expected exactly one schemas:start marker followed by exactly one schemas:end marker"
            exit 1
          fi

          awk -v list="$RUNNER_TEMP/schemas.md" '
            /<!-- schemas:start -->/ { print; print "<!-- generated by .github/workflows/schemas-update-readme.yml, do not edit -->"; print ""; while ((getline line < list) > 0) print line; skip = 1 }
            /<!-- schemas:end -->/ { skip = 0 }
            !skip { print }
          ' README.md > "$RUNNER_TEMP/README.md"
          mv "$RUNNER_TEMP/README.md" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: update schema packages list"
          git push
