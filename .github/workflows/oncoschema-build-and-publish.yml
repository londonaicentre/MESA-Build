name: build and publish oncoschema

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "schemas/oncoschema/**"

jobs:
  build-and-publish:
    if: github.event.pull_request.merged == true
    runs-on: codebuild-londonaicentre-org-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: pypi
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: schemas/oncoschema
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - name: Tag new version
        run: |
          VERSION=$(uv version --short)
          git tag "oncoschema-v${VERSION}"
          git push origin "oncoschema-v${VERSION}"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
