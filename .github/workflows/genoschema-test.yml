name: genoschema test

on:
  pull_request:
    branches:
      - main
    paths:
      - schemas/genoschema/**

jobs:
  test:
    runs-on: codebuild-londonaicentre-org-runner-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: schemas/genoschema
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: check version is bumped
        run: |
          current=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          main=$(git show origin/main:schemas/genoschema/pyproject.toml | grep '^version = ' | cut -d'"' -f2)
          if [ "$current" = "$main" ]; then
            echo "version must be bumped from $main"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/ tests/
      - run: uv run pytest tests
