name: build and publish llamaserve

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'llamaserve')
    runs-on: codebuild-londonaicentre-org-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: lib/infer/local/llamaserve
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --only-dev
      - run: uv build
      - run: uv publish
