name: build and publish genoschema

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "schemas/genoschema/**"

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/build-and-publish.yml
    with:
      working-directory: schemas/genoschema
      package: genoschema
