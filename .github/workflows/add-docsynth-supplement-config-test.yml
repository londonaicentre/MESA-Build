name: add-docsynth-supplement-config test

on:
  pull_request:
    branches:
      - main
    paths:
      - .claude/skills/add-docsynth-supplement-config/scripts/**

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-londonaicentre-org-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: .claude/skills/add-docsynth-supplement-config/scripts
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check
      - run: uv run mypy .
      - run: uv run pytest --cov --cov-fail-under=80
      - if: ${{ !cancelled() }}
        uses: vibecert/action@v1.0.0
