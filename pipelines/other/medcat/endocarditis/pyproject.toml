[project]
name = "endocarditis"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "dotenv>=0.9.9",
    "londonaicentre-conditionschema",
    "londonaicentre-docsynth>=2.3.0",
    "londonaicentre-mesa-datagen",
    "londonaicentre-mesa-runtime[admin]>=0.11.1",
    "londonaicentre-mesa-utils",
]

[tool.uv.sources]
londonaicentre-mesa-datagen = { path = "../../../../lib/datagen", editable = true }
londonaicentre-conditionschema = { path = "../../../../schemas/conditionschema", editable = true }
londonaicentre-mesa-utils = { path = "../../../../lib/utils", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
