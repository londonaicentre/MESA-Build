[project]
name = "opnote"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-NC-ND-4.0"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "londonaicentre-mesa-datagen",
    "londonaicentre-opnoteschema",
    "mesa-runtime",
]

[tool.uv.sources]
londonaicentre-mesa-datagen = { path = "../../lib/datagen", editable = true }
mesa-runtime = { git = "https://github.com/londonaicentre/mesa-runtime.git", subdirectory = "lib", rev = "main" }
