# HuggingFace PEFT LoRA Fine-tuning Configuration
# Sample config for high context job, e.g. oncoqwen

model: "Qwen/Qwen3-4B-Instruct-2507"
model_config:
  attn_implementation: "flash_attention_2"
  trust_remote_code: true

data_dir: "."
train_file: "train.jsonl"
valid_file: null  # don't need val data

lora_config:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training_args:
  output_dir: "./adapters"

  # SFTTrainer-specific settings
  dataset_text_field: "messages"  # Field containing conversation data
  max_length: 12288  # Maximum sequence length

  # high context training
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 1
  eval_accumulation_steps: 1

  num_train_epochs: 3

  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: "cosine"

  optim: "adamw_torch_fused"
  max_grad_norm: 1.0

  gradient_checkpointing: true

  eval_strategy: "no"
  save_strategy: "steps"
  save_steps: 1000
  save_safetensors: true
  save_total_limit: 3

  logging_steps: 10

  bf16: true
  tf32: true

  dataloader_num_workers: 0
  dataloader_pin_memory: true

  seed: 42
  remove_unused_columns: false
  report_to: "none"

  # unused if eval_strategy is "no"
  load_best_model_at_end: false
  metric_for_best_model: "eval_loss"
  greater_is_better: false
