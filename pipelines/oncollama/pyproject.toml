[project]
name = "londonaicentre-oncollama" 
description = "OncoLlama"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" },
    { name = "Sophie Ratkai", email = "s.ratkai@nhs.net" },
    { name = "Martin Chapman", email = "contact@martinchapman.co.uk" },
]
version = "1.0.0"
requires-python = ">=3.12"
license = "CC-BY-NC-ND-4.0"
dependencies = [
    "londonaicentre-schemallama-docsynth"
]
[project.scripts]
"docsynth" = "oncollama.docsynth:main"
[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.uv.sources]
londonaicentre-schemallama-docsynth = { path = "../../lib/docsynth", editable = true }
[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.6",
]
