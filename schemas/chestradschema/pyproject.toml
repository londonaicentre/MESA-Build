[project]
name = "londonaicentre-chestradschema"
version = "0.5.0"
description = "Chest radiology"
readme = "README.md"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" }
]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "londonaicentre-mesa-utils>=1.5.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
londonaicentre-mesa-utils = { path = "../../lib/utils", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.setuptools.package-data]
chestradschema = [
    "*.txt", 
    "examples/*.json", 
    "py.typed"
]
