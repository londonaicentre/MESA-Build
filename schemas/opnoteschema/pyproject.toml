[project]
name = "londonaicentre-opnoteschema"
version = "0.3.0"
description = "Operation notes"
readme = "README.md"
authors = [
    { name = "Joe Zhang", email = "jzhang@nhs.net" }
]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "londonaicentre-mesa-utils",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
londonaicentre-mesa-utils = { path = "../../lib/utils", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
[tool.setuptools.package-data]
opnoteschema = [
    "*.txt",
    "examples/*.json",
    "py.typed"
]
