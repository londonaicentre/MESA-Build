[project]
name = "londonaicentre-conditionschema"
version = "0.1.0"
description = "Condition"
readme = "README.md"
authors = [
    { name = "Martin Chapman", email = "contact@martinchapman.co.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "londonaicentre-mesa-utils>=1.5.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
londonaicentre-mesa-utils = { path = "../../lib/utils", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
[tool.setuptools.package-data]
conditionschema = [
    "*.txt", 
    "examples/*.json", 
    "py.typed"
]
