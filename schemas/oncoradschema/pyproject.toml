[project]
name = "londonaicentre-oncoradschema"
version = "0.6.1"
description = "Radiology"
readme = "README.md"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" },
    { name = "Dr. Emily Jin", email = "emily.jin@gstt.nhs.uk" }
]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "londonaicentre-mesa-utils>=1.5.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
londonaicentre-mesa-utils = { path = "../../lib/utils", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
[tool.setuptools.package-data]
oncoradschema = [
    "*.txt",
    "examples/*.json",
    "py.typed"
]
