[project]
name = "oncopathschema"
version = "0.1.0"
description = "Histopathology"
readme = "README.md"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" }
]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "londonaicentre-mesa-utils",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
londonaicentre-mesa-utils = { path = "../../lib/utils", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
[tool.setuptools.package-data]
oncopathschema = [
    "*.txt", 
    "examples/*.json", 
    "py.typed"
]
