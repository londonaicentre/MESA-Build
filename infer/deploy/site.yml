---
- name: create ec2 ansible inventory host on-the-fly
  hosts: localhost
  gather_facts: false
  tasks:
    - name: use plugin to extract terraform outputs
      community.general.terraform:
        state: present
        project_path: ./
      register: terraform_output
    - name: add ec2 instance to ansible inventory
      add_host:
        name: "{{ terraform_output.outputs.dns.value }}"
        groups: ec2
        ansible_ssh_user: ubuntu
        ansible_ssh_private_key_file: "{{ terraform_output.outputs.keypair.value }}"
        ansible_ssh_common_args: "-o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
- name: update packages
  hosts: ec2
  become: true
  tasks:
    - name: update and upgrade apt packages
      apt:
        upgrade: yes
        update_cache: yes
- name: install docker, adding ubuntu to docker group
  hosts: ec2
  become: true
  roles:
    - geerlingguy.docker
  vars:
    docker_users: [ubuntu]
