[project]
name = "llama-serve" 
description = "Llama serve" 
readme = "README.md"
version = "1.0.0"
requires-python = ">=3.12"
license = {file = "LICENSE.md"}
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
    "vllm>=0.11.0",
]
[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "tox>=4.30.2",
    "tox-uv>=1.28.0",
    "black>=25.9.0",
]
[project.scripts]
"llamaserve" = "llamaserve:run"
[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-data = {"llamaserve" = ["py.typed"]}
[tool.pytest.ini_options]
pythonpath = ["src"]
log_cli = "true"
log_cli_level = "DEBUG"
