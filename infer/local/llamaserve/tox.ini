[tox]
envlist = lint,typecheck,test
isolated_build = true

[flake8]
count = true
max-line-length = 12
max-complexity = 10
statistics = true
select = E9,F63,F7,F82
show-source = true
exclude = .venv,.tox

[pytest]
log_cli = true
log_cli_level = DEBUG

[testenv]
setenv =
  SSH_AUTH_SOCK = {env:SSH_AUTH_SOCK}
runner = uv-venv-runner

[testenv:lint]
commands = 
  uv run --isolated flake8 src/ tests/

[testenv:typecheck]
commands = 
  uv run --isolated mypy src/ tests/

[testenv:test]
commands = 
  uv run --isolated pytest tests {posargs}