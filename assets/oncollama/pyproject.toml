[project]
name = "londonaicentre-oncollama-assets" 
description = "OncoLlama assets"
authors = [
    { name = "Dr. Joe Zhang", email = "jzhang@nhs.net" }
]
version = "1.0.0"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = [ "LICENSE.md" ]
dependencies = [
    "londonaicentre-schemallama-types",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
]
[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.uv.sources]
londonaicentre-schemallama-types = { path = "../../lib/types", editable = true }
[tool.setuptools.package-data]
oncollama_assets = [
    "examples/*",
    "prompts/*",
    "py.typed"
]
[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.6",
    "types-pyyaml>=6.0.12.20250915",
]
